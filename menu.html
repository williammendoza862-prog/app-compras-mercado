<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú semanal</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f6f8;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  padding:25px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

.contenedor{
  max-width:700px;
  margin:20px auto;
  padding:0 15px;
}

.dia{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.dia h2{
  margin:0 0 12px;
  color:#1769aa;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:17px;
  background:white;
}

.boton{
  display:block;
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:#1769aa;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.volver{
  background:#4caf50;
}

.mensaje{
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:15px;
  text-align:center;
  font-size:17px;
}
</style>
</head>

<body>

<header>
  <h1>🍽️ Menú semanal</h1>
  <p>Planifica las comidas de la semana</p>
</header>

<div class="contenedor">

<div class="dia">
<h2>📅 Lunes</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Martes</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Miércoles</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Jueves</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Viernes</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Sábado</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<div class="dia">
<h2>📅 Domingo</h2>
<select>
<option>Seleccionar plato</option>
<option>🍗 Pollo guisado</option>
<option>🥣 Lentejas</option>
<option>🍝 Tallarines</option>
<option>🍳 Arroz con huevo</option>
<option>🥔 Pollo con papa</option>
</select>
</div>

<button class="boton" onclick="guardarMenu()">
💾 Guardar menú semanal
</button>

<button class="boton volver" onclick="location.href='index.html'">
🛒 Ir a Lista de compras
</button>

<div id="mensaje"></div>

</div>

<script>

function guardarMenu(){

  const platos = document.querySelectorAll("select");

  const menu = [];

  platos.forEach((plato,index)=>{
    menu.push(plato.value);
  });

  localStorage.setItem(
    "menuSemanal",
    JSON.stringify(menu)
  );

  document.getElementById("mensaje").innerHTML =
    '<div class="mensaje">✅ Menú semanal guardado correctamente</div>';
}

function cargarMenu(){

  const guardado =
    localStorage.getItem("menuSemanal");

  if(!guardado) return;

  const menu = JSON.parse(guardado);

  const platos =
    document.querySelectorAll("select");

  menu.forEach((valor,index)=>{
    if(platos[index]){
      platos[index].value = valor;
    }
  });
}

cargarMenu();

</script>

</body>
</html>
