<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Compras</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
margin:0;
background:#f3f6f8;
color:#222;
}

header{
background:#1769aa;
color:white;
padding:22px 16px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
font-size:16px;
}

.contenedor{
max-width:700px;
margin:auto;
padding:16px;
}

.tarjeta{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
margin-top:0;
color:#1769aa;
}

.plato{
display:flex;
align-items:center;
padding:14px 4px;
border-bottom:1px solid #eee;
font-size:18px;
}

.plato input{
width:24px;
height:24px;
margin-right:14px;
}

.boton{
width:100%;
padding:16px;
border:0;
border-radius:14px;
font-size:18px;
font-weight:bold;
background:#1769aa;
color:white;
margin-top:10px;
}

.categoria{
font-size:19px;
font-weight:bold;
margin-top:18px;
color:#1769aa;
}

.producto{
display:flex;
align-items:center;
padding:11px 4px;
border-bottom:1px solid #eee;
font-size:17px;
}

.producto input{
width:21px;
height:21px;
margin-right:12px;
}

.cantidad{
margin-left:auto;
font-weight:bold;
color:#16833b;
}

.vacio{
text-align:center;
color:#777;
padding:15px;
}

@media(max-width:500px){
header h1{font-size:27px}
}
</style>
</head>

<body>

<header>
<h1>🛒 Mis Compras</h1>
<p>Planifica tus compras según tus platos</p>
</header>

<div class="contenedor">

<div class="tarjeta">
<h2>🍽️ Selecciona tus platos</h2>

<label class="plato">
<input type="checkbox" value="pollo" onchange="generarLista()">
🍗 Pollo con arroz
</label>

<label class="plato">
<input type="checkbox" value="tallarines" onchange="generarLista()">
🍝 Tallarines
</label>

<label class="plato">
<input type="checkbox" value="lentejas" onchange="generarLista()">
🥣 Lentejas
</label>

<label class="plato">
<input type="checkbox" value="huevo" onchange="generarLista()">
🍳 Arroz con huevo
</label>

</div>

<div class="tarjeta">
<h2>🛒 Lista de compras</h2>

<div id="lista">
<div class="vacio">
Selecciona uno o más platos para generar tu lista.
</div>
</div>

</div>

<button class="boton" onclick="limpiar()">
🗑️ Limpiar selección
</button>

</div>

<script>

const recetas={

pollo:{
"🥩 Carnes y proteínas":{
"Pollo":"1 kg"
},
"🍚 Abarrotes":{
"Arroz":"1 kg"
},
"🥦 Verduras":{
"Cebolla":"2 unidades",
"Papa":"1 kg"
},
"🧂 Condimentos":{
"Sal":"1 paquete",
"Aceite":"1 botella"
}
},

tallarines:{
"🥩 Carnes y proteínas":{
"Carne molida":"500 g"
},
"🍚 Abarrotes":{
"Fideos":"500 g"
},
"🥦 Verduras":{
"Tomate":"4 unidades",
"Cebolla":"1 unidad"
},
"🧂 Condimentos":{
"Aceite":"1 botella"
}
},

lentejas:{
"🍚 Abarrotes":{
"Lentejas":"500 g",
"Arroz":"1 kg"
},
"🥦 Verduras":{
"Cebolla":"2 unidades",
"Tomate":"2 unidades"
},
"🥩 Carnes y proteínas":{
"Chorizo":"300 g"
},
"🧂 Condimentos":{
"Sal":"1 paquete",
"Aceite":"1 botella"
}
},

huevo:{
"🍳 Carnes y proteínas":{
"Huevos":"12 unidades"
},
"🍚 Abarrotes":{
"Arroz":"1 kg"
},
"🥦 Verduras":{
"Plátano":"6 unidades"
},
"🧂 Condimentos":{
"Aceite":"1 botella",
"Sal":"1 paquete"
}
}

};

function generarLista(){

const seleccionados=
document.querySelectorAll(
'input[type="checkbox"]:checked'
);

const lista={};

seleccionados.forEach(check=>{

const receta=recetas[check.value];

for(const categoria in receta){

if(!lista[categoria]){
lista[categoria]={};
}

for(const producto in receta[categoria]){

if(!lista[categoria][producto]){

lista[categoria][producto]=
receta[categoria][producto];

}else{

lista[categoria][producto]+=" + "+
receta[categoria][producto];

}

}

}

});

const contenedor=document.getElementById("lista");

if(Object.keys(lista).length===0){

contenedor.innerHTML=
'<div class="vacio">Selecciona uno o más platos para generar tu lista.</div>';

return;

}

let html="";

for(const categoria in lista){

html+=`<div class="categoria">${categoria}</div>`;

for(const producto in lista[categoria]){

html+=`
<div class="producto">
<input type="checkbox">
<span>${producto}</span>
<span class="cantidad">
${lista[categoria][producto]}
</span>
</div>
`;

}

}

contenedor.innerHTML=html;

}

function limpiar(){

document
.querySelectorAll('input[type="checkbox"]')
.forEach(c=>c.checked=false);

generarLista();

}

</script>

</body>
</html>
